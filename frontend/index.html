<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Investigation Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #0e0e10;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #title {
      position: fixed;
      top: 16px;
      left: 20px;
      z-index: 10;
      font-size: 20px;
      font-weight: bold;
    }

    svg {
      width: 100vw;
      height: 100vh;
    }

    .link {
      stroke: #888;
      stroke-opacity: 0.7;
      stroke-width: 2;
    }

    .node circle {
      fill: #4f46e5;
      stroke: white;
      stroke-width: 1.5;
    }

    .node text {
      font-size: 13px;
      fill: white;
      pointer-events: none;
    }

    .edge-label {
      fill: #cbd5e1;
      font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>

<body>
<div id="title">AI Investigation Graph</div>
<svg></svg>

<script>
fetch("/outputs/graph.json")
  .then(response => response.json())
  .then(data => {
    console.log("Graph loaded:", data);

    const nodes = data.nodes;
    const links = data.edges.map(edge => ({
      source: edge.from,
      target: edge.to,
      label: edge.label,
      context: edge.context,
      sourceFile: edge.source
    }));

    const svg = d3.select("svg");
    const width = window.innerWidth;
    const height = window.innerHeight;

    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(180))
      .force("charge", d3.forceManyBody().strength(-500))
      .force("center", d3.forceCenter(width / 2, height / 2));

    const link = svg.append("g")
      .selectAll("line")
      .data(links)
      .enter()
      .append("line")
      .attr("class", "link");

    const edgeLabels = svg.append("g")
      .selectAll("text")
      .data(links)
      .enter()
      .append("text")
      .attr("class", "edge-label")
      .text(d => d.label);

    const node = svg.append("g")
      .selectAll("g")
      .data(nodes)
      .enter()
      .append("g")
      .attr("class", "node")
      .call(drag(simulation));

    node.append("circle")
      .attr("r", d => 10 + d.importance);

    node.append("text")
      .text(d => d.label)
      .attr("x", 16)
      .attr("y", 5);

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      edgeLabels
        .attr("x", d => (d.source.x + d.target.x) / 2)
        .attr("y", d => (d.source.y + d.target.y) / 2);

      node
        .attr("transform", d => `translate(${d.x},${d.y})`);
    });
  })
  .catch(error => {
    console.error("Graph loading error:", error);
  });

function drag(simulation) {
  function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }

  function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }

  function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }

  return d3.drag()
    .on("start", dragstarted)
    .on("drag", dragged)
    .on("end", dragended);
}
</script>

</body>
</html>
